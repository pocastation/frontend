<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>연결이 끊겼어요 — 포카스테이션</title>
    <!--
      오프라인 폴백 문서. 서비스워커가 설치 시 캐시해 두고, 네트워크가 죽어 페이지를 못 받아올 때
      이 화면을 대신 보여준다. 네트워크 없이 떠야 하므로 **외부 폰트·스크립트를 쓰지 않는다** —
      웹폰트를 부르면 오프라인에서 그 요청이 실패하고 글자가 늦게 뜬다.
    -->
    <style>
      :root {
        --deepspace: #160c2e;
        --star: #ebc06b;
        --nebula: #c8bcff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 24px;
        background: var(--deepspace);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
        text-align: center;
      }
      .star { width: 56px; height: 56px; }
      h1 { margin: 22px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
      p { margin: 10px 0 0; font-size: 13.5px; line-height: 1.7; color: rgba(255, 255, 255, 0.6); }
      button {
        margin-top: 24px;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 7px;
        background: #5326d9;
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .mark {
        margin-top: 32px;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.35);
      }
    </style>
  </head>
  <body>
    <svg class="star" viewBox="0 0 32 32" aria-hidden="true">
      <path
        d="M16 5.5 18.6 12.44 25.98 12.76 20.18 17.36 22.17 24.49 16 20.4 9.83 24.49 11.82 17.36 6.02 12.76 13.4 12.44Z"
        fill="#ebc06b"
      />
    </svg>
    <h1>연결이 끊겼어요</h1>
    <p>
      네트워크에 닿지 못했어요.<br />
      연결을 확인한 뒤 다시 시도해 주세요.
    </p>
    <button type="button" onclick="location.reload()">다시 시도</button>
    <p class="mark">Pocastation</p>
  </body>
</html>
